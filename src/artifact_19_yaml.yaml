version: "3.8"

services:
  seekerpay-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seekerpay-br-daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=SekrBRZ111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RELAYER_KEYPAIR_PATH=/secrets/relayer-keypair.json
    volumes:
      - ./relayer-secrets:/secrets:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"