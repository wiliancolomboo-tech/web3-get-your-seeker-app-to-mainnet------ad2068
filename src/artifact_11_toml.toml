[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.localnet]
seeker_pay = "SeekerPay11111111111111111111111111111111111"

[programs.mainnet]
seeker_pay = "SeekerPay11111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Mainnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-node node_modules/.bin/mocha -r ts-node/register --timeout 60000 tests/**/*.ts"