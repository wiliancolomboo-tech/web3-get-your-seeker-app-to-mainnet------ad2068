version: '3.8'

services:
  seeker-pay-relayer:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=SekrPay111111111111111111111111111111111111
      - RELAYER_SECRET_KEY=${RELAYER_SECRET_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"