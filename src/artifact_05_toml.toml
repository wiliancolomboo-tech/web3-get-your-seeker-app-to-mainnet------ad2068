[package]
name = "seeker_pay"
version = "1.0.0"
description = "SeekerPay Brasil: Solana Mobile Seeker Mainnet Merchant Settlement Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "seeker_pay"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
solana-program = "1.18.26"